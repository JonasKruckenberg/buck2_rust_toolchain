name: Sync channels force
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sync-channels:
    name: Sync channels and prefetch toolchains
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable

      # Workaround for https://github.com/oxalica/rust-overlay/issues/54
      - name: Don't let ~/.cargo/bin mess things up
        run: rm -rf ~/.cargo/bin

      - name: Sync stable channel
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch.py stable all

      - name: Sync beta channel
        if: github.event.schedule != '0 14-20 * * THU'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch.py beta all

      - name: Sync nightly channel
        if: github.event.schedule != '0 14-20 * * THU'
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch.py nightly all

      - name: Check and commit changes
        id: commit
        continue-on-error: true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add manifests
          git commit -m "manifest: update"

      - name: Print changed files
        if: steps.commit.outcome == 'success'
        run: |
          files=( $(git diff --name-only HEAD HEAD^ '*.toml') )
          echo "${#files[*]} toml files changed: ${files[*]}"

      - name: Push changes
        if: steps.commit.outcome == 'success'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
